name: EP2/EP3 - Deploy Blue-Green en K3s con Rollback automático

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
        default: default
      image-uri:
        required: true
        type: string
      app-name:
        required: true
        type: string
        default: techmarket-orders
      container-port:
        required: true
        type: string
        default: "3000"
    secrets:
      KUBECONFIG_K3S:
        required: true

jobs:
  deploy:
    name: Blue-Green deploy + health check + rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del consumidor (necesita k8s/deployment-template.yaml y k8s/service.yaml)
        uses: actions/checkout@v4

      - name: Configurar kubeconfig del clúster K3s
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_K3S }}" | base64 -d > "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Verificar conexión al clúster
        run: kubectl get nodes

      - name: Asegurar que el Service exista (bootstrap solo la primera vez)
        env:
          APP: ${{ inputs.app-name }}
          NS: ${{ inputs.namespace }}
        run: |
          if ! kubectl get service "$APP" -n "$NS" >/dev/null 2>&1; then
            sed "s|__APP__|$APP|g" k8s/service.yaml | kubectl apply -n "$NS" -f -
          fi

      - name: Determinar color activo e inactivo
        id: color
        env:
          APP: ${{ inputs.app-name }}
          NS: ${{ inputs.namespace }}
        run: |
          CURRENT=$(kubectl get service "$APP" -n "$NS" -o jsonpath='{.spec.selector.color}' 2>/dev/null || echo "")
          if [ "$CURRENT" = "blue" ]; then
            echo "live=blue" >> "$GITHUB_OUTPUT"
            echo "idle=green" >> "$GITHUB_OUTPUT"
          else
            echo "live=green" >> "$GITHUB_OUTPUT"
            echo "idle=blue" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar nueva versión en el color inactivo
        env:
          COLOR: ${{ steps.color.outputs.idle }}
          IMAGE: ${{ inputs.image-uri }}
          APP: ${{ inputs.app-name }}
          NS: ${{ inputs.namespace }}
          PORT: ${{ inputs.container-port }}
        run: |
          sed -e "s|__COLOR__|$COLOR|g" \
              -e "s|__IMAGE__|$IMAGE|g" \
              -e "s|__APP__|$APP|g" \
              -e "s|__PORT__|$PORT|g" \
              k8s/deployment-template.yaml > deployment-generated.yaml
          kubectl apply -n "$NS" -f deployment-generated.yaml
          kubectl rollout status deployment/${APP}-${COLOR} -n "$NS" --timeout=120s

      - name: Validación de salud (Health Check) antes de mover tráfico
        id: healthcheck
        env:
          COLOR: ${{ steps.color.outputs.idle }}
          APP: ${{ inputs.app-name }}
          NS: ${{ inputs.namespace }}
          PORT: ${{ inputs.container-port }}
        run: |
          kubectl port-forward -n "$NS" deployment/${APP}-${COLOR} 8080:$PORT &
          PF_PID=$!
          sleep 6
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health || echo "000")
          kill $PF_PID 2>/dev/null || true
          echo "Status recibido: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check falló con status $STATUS"
            exit 1
          fi

      - name: Mover el 100% del tráfico al color nuevo
        if: success()
        env:
          COLOR: ${{ steps.color.outputs.idle }}
          APP: ${{ inputs.app-name }}
          NS: ${{ inputs.namespace }}
        run: |
          kubectl patch service "$APP" -n "$NS" -p "{\"spec\":{\"selector\":{\"app\":\"$APP\",\"color\":\"$COLOR\"}}}"
          echo "✅ Tráfico movido a color: $COLOR"

      - name: Escalar a cero el color anterior (limpieza, no crítico)
        if: success()
        env:
          LIVE_ANTERIOR: ${{ steps.color.outputs.live }}
          APP: ${{ inputs.app-name }}
          NS: ${{ inputs.namespace }}
        run: |
          kubectl scale deployment/${APP}-${LIVE_ANTERIOR} -n "$NS" --replicas=0 || true

      - name: ROLLBACK AUTOMÁTICO (la validación de salud falló)
        if: failure()
        env:
          COLOR: ${{ steps.color.outputs.idle }}
          LIVE: ${{ steps.color.outputs.live }}
          APP: ${{ inputs.app-name }}
          NS: ${{ inputs.namespace }}
        run: |
          echo "::warning::Ejecutando rollback automático. Tráfico permanece en $LIVE"
          kubectl patch service "$APP" -n "$NS" -p "{\"spec\":{\"selector\":{\"app\":\"$APP\",\"color\":\"$LIVE\"}}}" || true
          kubectl delete deployment "${APP}-${COLOR}" -n "$NS" --ignore-not-found=true